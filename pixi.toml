[workspace]
name = "probabilistic-segmentation"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]
requires-pixi = "==0.81.0"

[dependencies]
python = "3.11.*"
# Conservative compatibility baseline for this existing research code.
# Exact builds, including indirect dependencies, are saved in pixi.lock.
numpy = "1.26.*"
scipy = "1.13.*"
pandas = "2.2.*"
matplotlib = "3.9.*"
ipython = "8.*"
ipykernel = "6.*"
pytest = "8.*"
pytest-xdist = "3.*"
hypothesis = "6.*"
pylint = "3.*"
autopep8 = "2.*"

[pypi-dependencies]
# Used by notebooks/mantel_test.py.
mantel = "==2.2.1"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"
MPLCONFIGDIR = "$PIXI_PROJECT_ROOT/.cache/matplotlib"
XDG_CACHE_HOME = "$PIXI_PROJECT_ROOT/.cache"

[tasks]
test = "python -m pytest tests --ignore=tests/test_readers.py"
test-all = "python -m pytest tests"
